# 项目配置
spring:
  application:
    name: ai-agent
  profiles:
    active: local
  ai:
    # DeepSeek 模型配置
    deepseek:
      api-key: ${AI_DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-flash
          temperature: 0.8
    # 智谱 ZhipuAI 模型配置
    zhipuai:
      api-key: ${AI_ZHIPU_API_KEY:}
      base-url: https://open.bigmodel.cn/api/paas
      chat:
        options:
          model: glm-5.3-flash
          temperature: 0.8
    mcp:
      client:
        initialized: false
        # 握手/调用超时时间（默认 20s），MCP server 首次启动较慢时给足余量
        request-timeout: 60s
        sse:
          connections:
            image-search-mcp-server:
              url: http://localhost:8127
#        stdio:
#          servers-configuration: classpath:mcp-servers.json


  # 数据库配置（PostgreSQL + pgvector）
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_agent?stringtype=unspecified
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_uuid
  type-handlers-package: com.example.aiagent.typehandler
  mapper-locations: classpath:mapper/*.xml

# 文档存储
document:
  storage:
    base-path: ./data/documents

# Ollama 嵌入模型
ollama:
  base-url: http://localhost:11434
  embedding-model: bge-m3
  similarity-top-k: 3

server:
  # 服务器配置
  port: 8123
  # 上下文路径配置
  servlet:
    context-path: /api

# springdoc-openapi 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.example.aiagent.controller
# knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# 修改日志级别：查看 Spring AI 更多调用细节
logging:
  level:
    org.springframework.ai: DEBUG
#  pattern:
#    # 只保留线程名、类名、日志消息，移除日期、级别、pid等前缀
#    console: "%-50logger{50} : %msg%n"


